<table class="table table-hover">
  <thead class="table-dark table-hover">
    <tr>
      <th scope="col">Date & Heure</th>
      <th scope="col">Nom</th>
      <th scope="col">Mail</th>
      <th scope="col">Message</th>
      <th scope="col">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (message of messages ; track message.date; let i=$index) {
    <tr>
      <th scope="row">{{ message.date }}</th>
      <td>{{ message.nom }}</td>
      <td>{{ message.email }}</td>
      <td>{{ message.message }}</td>
      <td>
        <button class="btn btn-sm btn-primary">Repondre</button>
        <button class="btn btn-sm btn-danger" (click)="supprimerMessage(i)" >Supprimer</button>
      </td>
    </tr>}
    @empty {
    <tr>
      <td colspan="6">Aucun message disponible.</td>
    </tr>
    }
  </tbody>
</table>
