<main>
    <section>
        <form id="productForm">
            <h2>Ajouter un Produit</h2>

            <div>
                <label for="productName">Nom du produit : </label>
                <input type="text" name="productName" id="productName" placeholder="Le nom de votre prouduit" required>
            </div>

            <div>
                <label for="productPrice">Prix : </label>
                <input type="number" name="productPrice" id="productPrice" placeholder="Le prix de votre produit"
                    required>
            </div>

            <div>
                <label for="description" class="form-label">Description :</label>
                <textarea id="description" name="description" placeholder="Votre description" required></textarea>
            </div>

            <div>
                <label for="img">Image URL : </label>
                <input type="text" name="img" id="img" placeholder="image URL" required>
            </div>

            <button type="submit">Ajouter</button>
        </form>
    </section>
</main>
