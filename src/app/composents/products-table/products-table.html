<table class="table table-hover">
    <thead class="table-dark table-hover">
        <tr>
            <th scope="col">iD</th>
            <th scope="col">Nom</th>
            <th scope="col">Description</th>
            <th scope="col">Prix</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
    <tbody>
        @for (product of products; track product.id; let i = $index) {
        <tr>
            <th scope="row">{{ product.id }}</th>
            <td>{{ product.name }}</td>
            <td>{{ product.description }}</td>
            <td>{{ product.price }} €</td>
            <td>
                <button class="btn btn-sm btn-secondary" (click)="voirDetails(product.id)">Voir Details</button>
                <button class="btn btn-sm btn-primary"(click)="edit(product.id)">Modifier</button>
                <button class="btn btn-sm btn-danger"(click)="deleteProduct(product.id)">Supprimer</button>
            </td>
        </tr>
        }
        @empty {
            <tr>
                <td colspan="5">Aucun produit disponible.</td>
            </tr>
        }
        <!-- @if(products.length === 0) {
        <tr>
            <td colspan="5">Aucun produit disponible.</td>
        </tr>
        } @else {
            <tr>
                <td colspan="5">Des produits sont disponibles.</td>
            </tr>
        } -->
    </tbody>
</table>
